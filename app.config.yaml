app:
  name: "梦幻工具箱"
  description: "梦幻西游账号、收益、养成与抓鬼辅助工具箱"
  version: "1.0.0"
  author: "Developer"
  
  # 桌面端配置
  desktop:
    window_size: "1440x900"
    min_window_size: "1200x760"
    resizable: true
  
  # 依赖配置
  dependencies:
    - flet==0.86.2
    - cryptography>=3.4.8
    - matplotlib>=3.7.0
    - mss>=9.0.0
    - numpy>=1.24.0
    - opencv-python>=4.8.0
    - Pillow>=9.5.0
    - pyautogui>=0.9.54
    - rapidocr-onnxruntime>=1.2.0
    - requests>=2.28.0

  # 资源文件
  assets:
    - assets/
