app:
  name: "账号管理系统"
  description: "账号管理和记账本应用"
  version: "1.0.0"
  author: "Developer"
  
  # 桌面端配置
  desktop:
    window_size: "900x600"
    resizable: true
  
  # 移动端配置
  mobile:
    android:
      package: "com.example.menghuan_tools"
      activity_name: "MainActivity"
      permissions:
        - INTERNET
        - READ_EXTERNAL_STORAGE
        - WRITE_EXTERNAL_STORAGE
        - ACCESS_MEDIA_LOCATION
      min_sdk: 24
      target_sdk: 34
      app_icon: "assets/icon.png"
      launcher_name: "账号管理"
    
    ios:
      bundle_id: "com.example.menghuan_tools"
      app_icon: "assets/icon.png"

  # 依赖配置
  dependencies:
    - flet>=0.86.3
    - cryptography>=3.4.8
    - matplotlib>=3.7.0

  # 资源文件
  assets:
    - assets/